<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HAN Engagement Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="hero">

<p class="subtitle">
HAN JISUNG • ENGAGEMENT PROJECT
</p>

<h1>
   HAN JISUNG
   <span>ENGAGEMENT TRACKER</span>
</h1>

 </header>

<nav class="tabs">

<button>ALL</button>
<button>IG</button>
<button>X</button>
<button>TIKTOK</button>
<button>YT</button>

</nav>

<section class="progress-section">

<h2>PROGRESS</h2>

<div class="progress-bar">
<div class="progress-fill"></div>

</div>

</section>

<section class="stats">
  
<div class="stat-box">
  <span>LIKE</span>
  <strong id="total-like">0/0</strong>
</div>

<div class="stat-box">
  <span>COMMENT</span>
  <strong id="total-comment">0/0</strong>
</div>

<div class="stat-box">
  <span>SHARE</span>
  <strong id="total-share">0/0</strong>
</div>

<div class="stat-box">
  <span>SAVE</span>
  <strong id="total-save">0/0</strong>
</div>

</section>

<section class="posts-section">

<h3 class="section-title">
  SELECT A POST TO SUPPORT
</h3>

<div id="posts-container"></div>

</section>
                                                                                                                    
<div id="modal" class="modal">

<div class="modal-content">

<button id="close-modal">
✕
</button>

<h2 id="modal-title">
  Post Title
</h2>

<button id="open-post-btn">
  Open Post
</button>

<div class="actions">

<button class="action-btn" data-action="like">
  ❤️ Like
</button>

<button class="action-btn" data-action="comment">
  💬 Comment
</button>

<button class="action-btn" data-action="share">
  📤 Share
</button>

<button class="action-btn" data-action="save">
  🔖 Save
</button>

<button class="action-btn" data-action="repost">
  🔁 Repost
</button>

</div>

</div>

</div>

<div id="comment-modal" class="modal">

  <div class="modal-content">

    <button id="close-comment-modal">✕</button>

    <h2>COMMENT GENERATOR</h2>

    <select id="comment-language">
      <option value="english">English</option>
      <option value="spanish">Spanish</option>
      <option value="korean">Korean</option>
      <option value="japanese">Japanese</option>
      <option value="portuguese">Portuguese</option>
      <option value="italian">Italian</option>
      <option value="russian">Russian</option>
      <option value="german">German</option>
      <option value="polish">Polish</option>
      <option value="turkish">Turkish</option>
    </select>

    <div id="generated-comment">
      Generate a comment
    </div>

    <div class="comment-buttons">

    <button id="pick-comment-btn">
      🎲 Pick a comment
    </button>

    <button id="copy-comment-btn">
      📋 Copy comment
    </button>

    <button id="open-instagram-btn">
      📱 Open Instagram Post
    </button>
    </div>

    <div id="hashtags">
    </div>

    <button id="copy-hashtags-btn">
      📋 Copy hashtags
    </button>

  </div>

</div>

<script src="data/posts.js"></script>
<script src="data/comments.js"></script>
<script type="module" src="./app.js"></script>                                                                                       

</body>
</html>
